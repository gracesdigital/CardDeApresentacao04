<!DOCTYPE html>
<html lang="pt-BR">
<head>

        <span>ENTREVISTAS</span>
      </a>
      <a class="action" href="mailto:SEUEMAIL@gmail.com">
        <span class="action__icon"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="1.5"/><path d="m3 6 9 7 9-7"/></svg></span>
        <span>E-MAIL</span>

      <a class="action" href="https://SEU-SITE.com" target="_blank" rel="noopener noreferrer">
